# steveX router — stage B: slots are filled by the session's model (docs/路由阶段B实施细则.md).
- insert:
    - id: stevex-router
      name: '@stevex/dsh-router'
      config:
        clarifyMaxTurns: 2
        enabledHandlers:
          - fact
          - task
          - default
          - unsupported
          - clarify
        provider:
          mode: llm            # llm = 用当前会话的模型填槽；stub = 不判断（全按普通对话），离线调试用
          timeoutMs: 15000
          contextMessages: 6
